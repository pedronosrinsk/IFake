<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - Mobilidade STEM</title>
    <link rel="icon" href="{{ url_for('static', filename='image/ifro.png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .form-wrapper { max-width: 500px; margin: 40px auto; padding: 30px; border: 1px solid #ddd; border-radius: 5px; background: #fff; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        .btn-enviar { background: linear-gradient(90deg, #9c27b0, #009688); color: white; padding: 12px; border: none; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; border-radius: 4px; margin-top: 10px; }
        .btn-enviar:hover { opacity: 0.9; }
        /* Estilo para agrupar campos lado a lado */
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
    </style>
</head>
<body>
    <div class="top-header">
        <div class="brand">
            <small>IFRO</small>
            <h1>Instituto Federal de Rondônia</h1>
        </div>
    </div>

    <div class="form-wrapper">
        <h2 style="margin-bottom: 20px; color: #1a1a1a;">Ficha de Inscrição</h2>
        <p style="margin-bottom: 25px; color: #666; font-size: 13px;">Preencha os dados abaixo para prosseguir com o cadastro no edital.</p>
        
        <form action="{{ url_for('submit') }}" method="POST">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" required>
                </div>
                
                <div class="form-group">
                    <label for="matricula">Matrícula:</label>
                    <input type="text" id="matricula" name="matricula" required>
                </div>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" required>
            </div>

            <div class="form-row">
                <div class="form-group" style="flex: 0.6;">
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" required>
                </div>
                <div class="form-group">
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required>
                </div>
                <div class="form-group" style="flex: 0.4;">
                    <label for="estado">Estado (UF):</label>
                    <input type="text" id="estado" name="estado" maxlength="2" placeholder="Ex: RO" required>
                </div>
            </div>
            
            <button type="submit" class="btn-enviar">ENVIAR FORMULÁRIO</button>
        </form>
    </div>
</body>
</html>
